name: CI

on:
  push:
    branches: [main, stage-1-prototype]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mn/contracts typecheck
      - run: pnpm --filter @mn/contracts test
      - run: pnpm --filter frontend typecheck
      - run: pnpm --filter frontend lint
      - run: pnpm --filter frontend test
      - run: pnpm --filter frontend build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
          NEXT_PUBLIC_PYODIDE_INDEX_URL: https://cdn.jsdelivr.net/pyodide/v314.0.7/full/

  e2e:
    # real UI + real Pyodide CAS, scripted (mock) AI: no secrets needed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend exec playwright install --with-deps chromium
      - run: pnpm --filter frontend test:e2e
        env:
          CI: 'true'
          # GitHub's Linux runners (4 vCPU, 16 GB) fit three browsers with Pyodide
          E2E_WORKERS: '3'
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
          NEXT_PUBLIC_PYODIDE_INDEX_URL: https://cdn.jsdelivr.net/pyodide/v314.0.7/full/
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: /tmp/math-notebook-e2e
          retention-days: 7

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: cd packages/cas-core && uv run pytest -q
      - run: cd packages/cas-core && uv run ruff check cas_core tests
      - run: cd backend && uv run pytest -q
      - run: cd backend && uv run ruff check app tests
      # without the multi-GB Lean project the real-Lean tests skip; source screening and message mapping still run
      - run: cd lean-worker && uv run pytest -q
      - run: cd lean-worker && uv run ruff check lean_worker tests
      # every shared CAS oracle case through the worker's HTTP API, in real SymPy processes
      - run: cd cas-worker && uv run pytest -q
      - run: cd cas-worker && uv run ruff check cas_worker tests
