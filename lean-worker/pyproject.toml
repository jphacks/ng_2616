[project]
name = "math-notebook-lean-worker"
version = "0.1.0"
description = "Checks Lean proofs against a pinned Mathlib for Math Notebook (ADR 0008). No LLM, no secrets."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.17.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["lean: needs the built Lean project (skipped otherwise)"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# FastAPI's dependency injection uses Depends() in argument defaults by design
ignore = ["B008"]
