[project]
name = "math-notebook-backend"
version = "0.1.0"
description = "Math Notebook API (FastAPI). Stage 1 template: health/capabilities live, jobs not wired."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.17.2"]
# Stage 2+: LLM adapter and PDF processing
llm = ["google-genai"]
pdf = ["pypdf", "pypdfium2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# FastAPI's dependency injection uses Depends() in argument defaults by design
ignore = ["B008"]
