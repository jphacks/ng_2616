services:
  api:
    build: .
    env_file: .env
    ports:
      # bound to loopback only; Caddy on the host terminates TLS on 443 (spec §3)
      - "127.0.0.1:8000:8000"
    volumes:
      - jobs:/var/lib/math-notebook
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  jobs:
